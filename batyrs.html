<!doctype html>
<html lang="kk" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Батырлар — Batyrlar.com</title>
  <meta name="description" content="Қазақ батырларының каталогы: эпикалық және тарихи батырлар. Каталог казахских батыров.">
  <meta name="theme-color" content="#faf6ef">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("batyrlar.theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'%3E%3Crect width='120' height='100' fill='%230b0a09'/%3E%3Cg fill='none' stroke='%23d6aa5c' stroke-width='8' stroke-linecap='round'%3E%3Cpath d='M60 94V58C60 30 34 20 20 34C8 46 18 66 34 60C46 55 42 40 32 42M60 58C60 30 86 20 100 34C112 46 102 66 86 60C74 55 78 40 88 42'/%3E%3C/g%3E%3C/svg%3E">
  <meta property="og:title" content="Батырлар — Batyrlar.com">
  <meta property="og:description" content="Ел қорғаған батырлар: Қабанбай, Исатай, Махамбет, Қобыланды, Алпамыс және басқалар.">
  <meta property="og:image" content="assets/img/hero.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/pages/batyrs.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Мазмұнға өту</a>
  <header data-site-header data-page="batyrs"></header>

  <main id="main">
    <section class="page-hero">
      <svg class="page-hero__orn" aria-hidden="true"><use href="#orn-rosette"/></svg>
      <div class="container page-hero__inner">
        <p class="eyebrow" data-i18n="page.batyrs.eyebrow">Каталог</p>
        <h1 class="page-hero__title" data-i18n="page.batyrs.title">Батырлар</h1>
        <p class="page-hero__lead" data-i18n="page.batyrs.lead"></p>
      </div>
      <div class="ornament-band" aria-hidden="true"></div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="toolbar" role="search">
          <div class="filters" role="group" data-i18n-attr="aria-label:filter.label">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">
              <span data-i18n="filter.all">Барлығы</span><span class="filter__count"></span>
            </button>
            <button class="filter" type="button" data-filter="epic" aria-pressed="false">
              <span data-i18n="type.epicPlural">Эпикалық батырлар</span><span class="filter__count"></span>
            </button>
            <button class="filter" type="button" data-filter="historical" aria-pressed="false">
              <span data-i18n="type.historicalPlural">Тарихи батырлар</span><span class="filter__count"></span>
            </button>
          </div>

          <div class="search">
            <label class="visually-hidden" for="search" data-i18n="search.label">Есім бойынша іздеу</label>
            <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="search__input" id="search" type="search" autocomplete="off" spellcheck="false"
                   data-i18n-attr="placeholder:search.placeholder" aria-describedby="results-count">
            <button class="search__clear" id="search-clear" type="button" hidden data-i18n-attr="aria-label:search.clear">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <p class="results-count" id="results-count" role="status" aria-live="polite"></p>

        <ul class="catalog" id="batyr-grid" role="list"></ul>

        <div class="empty" id="results-empty" hidden>
          <svg class="empty__orn" aria-hidden="true"><use href="#orn-koshkar"/></svg>
          <h2 class="empty__title" data-i18n="results.empty">Ештеңе табылмады</h2>
          <p data-i18n="results.emptyHint"></p>
          <button class="btn btn--ghost" id="results-reset" type="button" data-i18n="results.reset">Сүзгіні тастау</button>
        </div>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
